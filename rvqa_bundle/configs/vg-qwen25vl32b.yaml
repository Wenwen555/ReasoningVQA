# PLACEHOLDER - do not launch until >=3 free GPUs are available (32B bf16 needs
# model parallelism; the current trainer uses device_map={"":0} = one GPU per
# process, so this is not yet runnable as-is). Kept one command away for later.
source:
  pipeline_root: /data/wenjt/reasoningvqa_bench/pipeline/pipelines

output:
  experiment_root: /data/wenjt/reasoningvqa_bench/runs/vg-qwen25vl32b

runtime:
  # Qwen2.5-VL legacy module prefixes require transformers 4.49.0.
  python: /data/wenjt/conda_envs/videoespresso-common/bin/python

model:
  backend: qwen_vl
  checkpoint: /data/wenjt/models/llm_models/Qwen2.5-VL-32B-Instruct
  inventory: /data/wenjt/reasoningvqa_bench/inventories/qwen25vl32b-instruct.json

datasets:
  sources:
    - name: visual-genome-train
      adapter: visual_genome
      input: /data/wenjt/reasoningvqa_bench/data/visual_genome/train.english.jsonl
      image_root: /data/wenjt/reasoningvqa_subsets/visual_genome/images
      split: train
    - name: visual-genome-dev
      adapter: visual_genome
      input: /data/wenjt/reasoningvqa_bench/data/visual_genome/eval.english.jsonl
      image_root: /data/wenjt/reasoningvqa_subsets/visual_genome/images
      split: dev
  manifests:
    - name: train
      inputs: [visual-genome-train]
    - name: dev
      inputs: [visual-genome-dev]

actions:
  prepare: []
  train:
    - name: train-canonical-sft
      operation: canonical_sft
      env:
        CUDA_VISIBLE_DEVICES: "8"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --model
        - "{model}"
        - --manifest
        - "{experiment_root}/data/manifests/train.jsonl"
        - --inventory
        - "{inventory}"
        - --output
        - "{experiment_root}/train"
        - --lora-scope
        - language
        - --trust-remote-code
  evaluate:
    - name: evaluate-canonical
      operation: canonical_generation
      env:
        CUDA_VISIBLE_DEVICES: "8"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --manifest
        - "{experiment_root}/data/manifests/dev.jsonl"
        - --model
        - "{model}"
        - --adapter
        - "{experiment_root}/train/adapter"
        - --output
        - "{experiment_root}/evaluation/correct-image"
        - --mode
        - correct-image
    - name: validate-canonical-predictions
      script: evaluate/validate_canonical_predictions.py
      args:
        - --manifest
        - "{experiment_root}/data/manifests/dev.jsonl"
        - --predictions
        - "{experiment_root}/evaluation/correct-image/predictions.jsonl"
        - --output
        - "{experiment_root}/evaluation/correct-image/independent_validation.json"
        - --mode
        - correct-image
