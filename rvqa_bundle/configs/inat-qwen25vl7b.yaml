# iNaturalist + Qwen2.5-VL-7B runbook.
# All machine-specific paths are empty on purpose; fill them in for your setup.

source:
  # Directory that contains prepare/, train/, evaluate/.
  pipeline_root: ""

output:
  experiment_root: ""

runtime:
  # Python interpreter matching the model's transformers version.
  python: ""

model:
  backend: qwen_vl
  checkpoint: ""
  inventory: ""

datasets:
  sources:
    - name: inaturalist-train
      adapter: inaturalist
      input: ""
      image_root: ""
      split: train
    - name: inaturalist-dev
      adapter: inaturalist
      input: ""
      image_root: ""
      split: dev
  manifests:
    - name: train
      inputs: [inaturalist-train]
    - name: dev
      inputs: [inaturalist-dev]

actions:
  prepare: []
  train:
    - name: train-canonical-sft
      operation: canonical_sft
      env:
        CUDA_VISIBLE_DEVICES: "0"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --model
        - "{model}"
        - --manifest
        - "{experiment_root}/data/manifests-open/train.jsonl"
        - --inventory
        - "{inventory}"
        - --output
        - "{experiment_root}/train"
        - --lora-scope
        - language
        - --trust-remote-code
  evaluate:
    - name: evaluate-canonical
      operation: canonical_generation
      env:
        CUDA_VISIBLE_DEVICES: "0"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --manifest
        - "{experiment_root}/data/manifests-open/dev.jsonl"
        - --answer-mode
        - open
        - --model
        - "{model}"
        - --adapter
        - "{experiment_root}/train/adapter"
        - --output
        - "{experiment_root}/evaluation/correct-image"
        - --mode
        - correct-image
    - name: validate-canonical-predictions
      script: evaluate/validate_canonical_predictions.py
      args:
        - --manifest
        - "{experiment_root}/data/manifests-open/dev.jsonl"
        - --answer-mode
        - open
        - --predictions
        - "{experiment_root}/evaluation/correct-image/predictions.jsonl"
        - --output
        - "{experiment_root}/evaluation/correct-image/independent_validation.json"
        - --mode
        - correct-image
