# Visual Genome + MiniCPM-V-2_6 runbook.
# All machine-specific paths are empty on purpose; fill them in for your setup.
# MiniCPM-V uses the string-content chat path; the trainer auto-detects it.

source:
  pipeline_root: ""

output:
  experiment_root: ""

runtime:
  python: ""

model:
  backend: qwen_vl
  checkpoint: ""
  inventory: ""

datasets:
  sources:
    - name: visual-genome-train
      adapter: visual_genome
      input: ""
      image_root: ""
      split: train
    - name: visual-genome-dev
      adapter: visual_genome
      input: ""
      image_root: ""
      split: dev
  manifests:
    - name: train
      inputs: [visual-genome-train]
    - name: dev
      inputs: [visual-genome-dev]

actions:
  prepare: []
  train:
    - name: train-canonical-sft
      operation: canonical_sft
      env:
        CUDA_VISIBLE_DEVICES: "0"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --model
        - "{model}"
        - --manifest
        - "{experiment_root}/data/manifests/train.jsonl"
        - --inventory
        - "{inventory}"
        - --output
        - "{experiment_root}/train"
        - --lora-scope
        - language
        - --trust-remote-code
  evaluate:
    - name: evaluate-canonical
      operation: canonical_generation
      env:
        CUDA_VISIBLE_DEVICES: "0"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --manifest
        - "{experiment_root}/data/manifests/dev.jsonl"
        - --model
        - "{model}"
        - --adapter
        - "{experiment_root}/train/adapter"
        - --output
        - "{experiment_root}/evaluation/correct-image"
        - --mode
        - correct-image
    - name: validate-canonical-predictions
      script: evaluate/validate_canonical_predictions.py
      args:
        - --manifest
        - "{experiment_root}/data/manifests/dev.jsonl"
        - --predictions
        - "{experiment_root}/evaluation/correct-image/predictions.jsonl"
        - --output
        - "{experiment_root}/evaluation/correct-image/independent_validation.json"
        - --mode
        - correct-image
