# Portable three-source (iNaturalist + GLDv2 + Visual Genome) template.
#
# Every machine-specific value below is an empty string on purpose. Fill in the
# paths for your own setup before running; `--dry-run` renders the full command
# list without touching the filesystem.

source:
  # Directory that contains prepare/, train/, evaluate/.
  pipeline_root: ""

output:
  # Where canonical manifests, training output and predictions are written.
  experiment_root: ""

runtime:
  # Python interpreter of the training environment.
  python: ""

model:
  backend: qwen_vl
  # Local model directory and its LoRA target inventory.
  checkpoint: ""
  inventory: ""

datasets:
  sources:
    - name: inaturalist-train
      adapter: inaturalist
      input: ""
      image_root: ""
      split: train
    - name: inaturalist-dev
      adapter: inaturalist
      input: ""
      image_root: ""
      split: dev
    - name: gldv2-train
      adapter: gldv2
      input: ""
      image_root: ""
      split: train
    - name: gldv2-dev
      adapter: gldv2
      input: ""
      image_root: ""
      split: dev
    - name: visual-genome-train
      adapter: visual_genome
      input: ""
      image_root: ""
      split: train
    - name: visual-genome-dev
      adapter: visual_genome
      input: ""
      image_root: ""
      split: dev
  manifests:
    - name: train
      inputs: [inaturalist-train, gldv2-train, visual-genome-train]
    - name: dev
      inputs: [inaturalist-dev, gldv2-dev, visual-genome-dev]

actions:
  prepare: []
  train:
    - name: train-canonical-sft
      operation: canonical_sft
      env:
        CUDA_VISIBLE_DEVICES: "0"
      args:
        - --model
        - "{model}"
        - --manifest
        - "{experiment_root}/data/manifests/train.jsonl"
        - --inventory
        - "{inventory}"
        - --output
        - "{experiment_root}/train"
  evaluate:
    - name: evaluate-canonical
      operation: canonical_generation
      env:
        CUDA_VISIBLE_DEVICES: "0"
      args:
        - --manifest
        - "{experiment_root}/data/manifests/dev.jsonl"
        - --model
        - "{model}"
        - --adapter
        - "{experiment_root}/train/adapter"
        - --output
        - "{experiment_root}/evaluation/correct-image"
        - --mode
        - correct-image
    - name: validate-canonical-predictions
      script: evaluate/validate_canonical_predictions.py
      args:
        - --manifest
        - "{experiment_root}/data/manifests/dev.jsonl"
        - --predictions
        - "{experiment_root}/evaluation/correct-image/predictions.jsonl"
        - --output
        - "{experiment_root}/evaluation/correct-image/independent_validation.json"
        - --mode
        - correct-image
