# Example structured-GLDv2 run for the public pipeline.
#
# Every machine-specific value below is an empty string on purpose. Fill in the
# paths for your own setup before running:
#
#   source.pipeline_root  directory that contains prepare/, train/, evaluate/
#   output.experiment_root  where manifests, checkpoints and predictions go
#   runtime.python        python interpreter of the training environment
#   model.checkpoint      local model directory
#   model.inventory       LoRA target inventory built by
#                         tools/build_model_inventory.py
#   args                  dataset / inventory paths consumed by the steps
#
# `run_pipeline.py ... --dry-run` prints the rendered commands without touching
# the filesystem, which is the quickest way to check your edits.

source:
  pipeline_root: ""

output:
  experiment_root: ""

runtime:
  python: ""

model:
  backend: qwen_vl
  checkpoint: ""
  inventory: ""

actions:
  prepare:
    - name: build-structured-reasoning
      script: prepare/build_structured_reasoning.py
      args:
        - --groups
        - ""
        - --formal-train
        - ""
        - --formal-eval
        - ""
        - --third-view
        - ""
        - --output
        - "{experiment_root}/data"
    - name: validate-structured-reasoning-data
      script: prepare/validate_structured_reasoning.py
      args:
        - --train
        - "{experiment_root}/data/train.jsonl"
        - --dev
        - "{experiment_root}/data/dev.jsonl"
        - --formal-train
        - ""
        - --formal-eval
        - ""
        - --output
        - "{experiment_root}/data/independent_validation.json"

  train:
    - name: train-structured-sft
      operation: structured_sft
      env:
        CUDA_VISIBLE_DEVICES: "0"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --model
        - "{model}"
        - --manifest
        - "{experiment_root}/data/train.jsonl"
        - --inventory
        - "{inventory}"
        - --output
        - "{experiment_root}/train"

  evaluate:
    - name: evaluate-correct-image
      operation: structured_generation
      env:
        CUDA_VISIBLE_DEVICES: "0"
        TRANSFORMERS_OFFLINE: "1"
      args:
        - --manifest
        - "{experiment_root}/data/dev.jsonl"
        - --model
        - "{model}"
        - --adapter
        - "{experiment_root}/train/adapter"
        - --output
        - "{experiment_root}/evaluation/correct-image"
        - --mode
        - correct-image
    - name: validate-correct-image
      script: evaluate/validate_predictions.py
      args:
        - --manifest
        - "{experiment_root}/data/dev.jsonl"
        - --predictions
        - "{experiment_root}/evaluation/correct-image/predictions.scored.jsonl"
        - --output
        - "{experiment_root}/evaluation/correct-image/independent_validation.json"
        - --mode
        - correct-image
